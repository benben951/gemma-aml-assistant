name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic

      - name: Run evaluator tests
        run: |
          python -m pytest tests/test_due_diligence_eval.py -q

      - name: Run sample AML evaluation
        run: |
          python scripts/evaluate_due_diligence.py \
            --cases examples/sample_scored_outputs.jsonl \
            --scores-out /tmp/sample_scores.jsonl \
            --summary-out /tmp/sample_summary.json
